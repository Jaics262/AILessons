name: AI quality gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Day01/AIPromptLab.Tests/AIPromptLab.Tests.csproj

      - name: Build
        run: dotnet build Day01/AIPromptLab.Tests/AIPromptLab.Tests.csproj --no-restore

      - name: Test
        run: dotnet test Day01/AIPromptLab.Tests/AIPromptLab.Tests.csproj --no-build --verbosity normal

      - name: Regression gate
        run: dotnet run --project Day01/AIPromptLab/AIPromptLab.csproj --no-build -- regression-gate --baseline Day01/AIPromptLab/Evaluation/snapshots/baseline.json --candidate Day01/AIPromptLab/Evaluation/snapshots/passing.json --report reports/quality.json

      - name: Upload quality report
        uses: actions/upload-artifact@v6
        with:
          name: quality-report
          path: Day01/AIPromptLab/reports/quality.json
          if-no-files-found: error
        # Use always() to publish the report when the regression gate fails.
        if: ${{ always() }}
